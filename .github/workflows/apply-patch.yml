name: Yama Uygula

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Yamalari uygula
        run: |
          set -e
          for g in patches/*.patch.gz; do
            [ -f "$g" ] && gunzip -f "$g"
          done
          for p in patches/*.patch; do
            [ -f "$p" ] || continue
            echo "applying $p"
            git apply -p1 "$p"
            rm -f "$p"
          done
          python -c "import ast; ast.parse(open('render.py').read()); ast.parse(open('pipeline.py').read())"
          git config user.name "tarihin-karanligi-bot"
          git config user.email "tarihin-karanligi-bot@users.noreply.github.com"
          git add -A
          git commit -m "Yama uygulandi"
          git push
