name: Ses ornekleri

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kurulum
        run: |
          command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          pip install -q edge-tts
      - name: Ses uret
        run: python tools/ses_ornek.py
      - name: Kaydet
        run: |
          git config user.name "tarihin-karanligi-bot"
          git config user.email "tarihin-karanligi-bot@users.noreply.github.com"
          mv ses /tmp/ses
          git fetch -q origin state
          git checkout -q -B state origin/state
          mkdir -p sample && rm -rf sample/ses && cp -r /tmp/ses sample/ses
          git add sample
          git commit -q -m "Ses ornekleri" && git push -q origin state
